<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram 연결 설정</title>
</head>
<body style="font-family:Arial,sans-serif;max-width:480px;margin:40px auto;padding:20px">
  <h2>텔레그램 웹훅 연결</h2>
  <p>Vercel의 WEBHOOK_SETUP_KEY 값을 입력해.</p>
  <form id="setup">
    <input id="key" type="password" required
      autocomplete="off" placeholder="설정 비밀키"
      style="width:100%;padding:12px;box-sizing:border-box">
    <button style="margin-top:12px;padding:12px;width:100%">
      웹훅 등록
    </button>
  </form>
  <pre id="result" style="white-space:pre-wrap"></pre>
  <script>
    document.getElementById("setup").addEventListener("submit", async e => {
      e.preventDefault();
      const button = e.submitter;
      button.disabled = true;
      const result = document.getElementById("result");
      result.textContent = "등록 요청 중...";

      try {
        const response = await fetch("/api/set-webhook", {
          method: "POST",
          headers: {
            "x-setup-key": document.getElementById("key").value
          }
        });
        const data = await response.json();
        result.textContent = response.ok && data.ok
          ? "성공! 웹훅이 등록됐어."
          : "실패: " + (data.description || data.error || "설정 확인 필요");
      } catch {
        result.textContent = "요청 실패. 배포 상태와 API 경로를 확인해 줘.";
      } finally {
        document.getElementById("key").value = "";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
