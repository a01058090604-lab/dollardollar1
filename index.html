
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DollarDollar 밈 관리자</title>
  <style>
    :root {
      --lime: #d5f477;
      --bg: #f7f8f2;
      --ink: #20221b;
      --muted: #77796e;
      --line: #e6e8dd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px 6%;
      background: white;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { font-size: 21px; font-weight: 900; }
    .brand span {
      background: var(--lime);
      padding: 5px 8px;
      border-radius: 8px;
    }
    .tag {
      background: #f0f1e9;
      border-radius: 99px;
      padding: 8px 12px;
      font-size: 12px;
    }
    main { max-width: 1000px; margin: auto; padding: 32px 18px; }
    h1 { font-size: clamp(28px, 5vw, 42px); margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.6; }
    .notice {
      background: #fff7d6;
      padding: 15px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      margin: 22px 0;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 22px 0;
    }
    .stat, .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
    }
    .stat strong { display: block; font-size: 28px; margin-top: 8px; }
    .section-title { font-size: 20px; font-weight: 800; margin: 28px 0 12px; }
    label { display: block; font-size: 13px; font-weight: bold; margin: 14px 0 7px; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      background: white;
    }
    textarea { min-height: 76px; resize: vertical; }
    button {
      border: 0;
      border-radius: 11px;
      padding: 12px 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .primary { background: var(--lime); color: var(--ink); }
    .secondary { background: #f0f1e9; }
    .danger { background: #ffe5e1; }
    .form-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .item {
      border: 1px solid var(--line);
      padding: 16px;
      border-radius: 14px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }
    .item h3 { margin: 0 0 8px; }
    .status { font-size: 12px; font-weight: 800; }
    .item-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    footer { padding: 25px; text-align: center; color: var(--muted); font-size: 12px; }
    @media (max-width: 520px) {
      .stats { grid-template-columns: 1fr; }
      header { padding: 18px; }
      main { padding: 24px 14px; }
    }
  </style>
</head>
<body>
<header>
  <div class="brand"><span>DollarDollar</span> MEME</div>
  <div class="tag">관리자 화면 · 데모</div>
</header>

<main>
  <h1>밈 콘텐츠 관리</h1>
  <p>콘텐츠를 검토하고 권리 증거를 확인한 뒤 게시 승인 여부를 관리해.</p>

  <div class="notice">
    ⚠️ 현재는 화면 데모야. 입력 내용은 이 브라우저에만 저장돼.
    실제 인스타그램 게시나 서버 권리 검증은 아직 연결되지 않았어.
    허가 증거를 확인하기 전에는 승인하지 마.
  </div>

  <div class="stats">
    <div class="stat">전체 콘텐츠<strong id="total">0</strong></div>
    <div class="stat">검토 대기<strong id="pending">0</strong></div>
    <div class="stat">승인 완료<strong id="approved">0</strong></div>
  </div>

  <div class="section-title">새 콘텐츠 등록</div>
  <section class="panel">
    <form id="contentForm">
      <label for="title">콘텐츠 제목</label>
      <input id="title" required placeholder="예: 오늘의 밈">

      <label for="url">원본 콘텐츠 URL</label>
      <input id="url" type="url" required placeholder="https://...">

      <label for="license">라이선스 종류</label>
      <select id="license" required>
        <option value="">선택해 줘</option>
        <option>상업적 재사용 허용</option>
        <option>직접 제작</option>
        <option>별도 서면 허가</option>
      </select>

      <label for="evidence">권리 증거 URL 또는 기록</label>
      <textarea id="evidence" required placeholder="라이선스 페이지, 허가 기록, 증빙 정보"></textarea>

      <label for="expiry">허가 만료일 (선택)</label>
      <input id="expiry" type="date">

      <div class="form-actions">
        <button class="primary" type="submit">검토 목록에 추가</button>
      </div>
    </form>
  </section>

  <div class="section-title">콘텐츠 검토 목록</div>
  <div id="list"></div>
</main>

<footer>DollarDollar · Rights-first Meme Workflow</footer>

<script>
  const STORAGE_KEY = "dollardollar_demo_items";
  let items = [];

  try {
    items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (!Array.isArray(items)) items = [];
  } catch {
    items = [];
  }

  const $ = id => document.getElementById(id);

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    render();
  }

  function render() {
    $("total").textContent = items.length;
    $("pending").textContent = items.filter(x => x.status === "검토 대기").length;
    $("approved").textContent = items.filter(x => x.status === "승인").length;

    $("list").replaceChildren();

    if (!items.length) {
      const empty = document.createElement("p");
      empty.textContent = "아직 등록된 콘텐츠가 없어.";
      $("list").append(empty);
      return;
    }

    items.forEach(item => {
      const card = document.createElement("article");
      card.className = "item";

      const heading = document.createElement("h3");
      heading.textContent = item.title;

      const status = document.createElement("div");
      status.className = "status";
      status.textContent = "상태: " + item.status;

      const details = document.createElement("p");
      details.textContent =
        "라이선스: " + item.license +
        "\n원본: " + item.url +
        "\n증거: " + item.evidence +
        "\n만료일: " + (item.expiry || "미입력");

      details.style.whiteSpace = "pre-line";

      card.append(heading, status, details);

      const actions = document.createElement("div");
      actions.className = "item-actions";

      const approve = document.createElement("button");
      approve.className = "primary";
      approve.textContent = "권리 확인 후 승인";
      approve.addEventListener("click", () => {
        if (item.expiry && item.expiry < new Date().toISOString().slice(0, 10)) {
          alert("만료된 허가라 승인할 수 없어.");
          return;
        }
        if (!confirm("원본과 상업적 이용 권리 증거를 직접 확인했어?")) return;
        item.status = "승인";
        save();
      });

      const reject = document.createElement("button");
      reject.className = "secondary";
      reject.textContent = "승인 취소 / 보류";
      reject.addEventListener("click", () => {
        item.status = "보류";
        save();
      });

      const remove = document.createElement("button");
      remove.className = "danger";
      remove.textContent = "삭제";
      remove.addEventListener("click", () => {
        if (!confirm("이 콘텐츠를 삭제할까?")) return;
        items = items.filter(x => x.id !== item.id);
        save();
      });

      actions.append(approve, reject, remove);
      card.append(actions);
      $("list").append(card);
    });
  }

  $("contentForm").addEventListener("submit", event => {
    event.preventDefault();

    const url = $("url").value.trim();
    const evidence = $("evidence").value.trim();

    if (!/^https?:\/\//i.test(url)) {
      alert("유효한 원본 URL을 입력해 줘.");
      return;
    }

    items.unshift({
      id: Date.now().toString(),
      title: $("title").value.trim(),
      url,
      license: $("license").value,
      evidence,
      expiry: $("expiry").value,
      status: "검토 대기"
    });

    save();
    event.target.reset();
  });

  render();
</script>
</body>
</html>
